# Pipeline: annotations.events → InfluxDB 3
# Consumes human annotation events (audio/photo/text observations) from Redpanda
# and writes lightweight metadata to InfluxDB as the "annotations" measurement.
#
# IMPORTANT: this pipeline only carries METADATA + a POINTER (object_key) to the
# media/content stored in MinIO. The actual content (audio file, photo, full text)
# lives in the data lake and is NEVER written to InfluxDB.
#
# "summary" is an OPTIONAL, client-provided short label — the system never
# generates it automatically (that would tie the pipeline to a specific domain).
#
# Context model (Option 2): "location" is one CONTEXT TYPE, modeled as a low-cardinality
# tag. Other types (asset, subsystem, ...) can be added later as extra tags without a
# schema change. GPS coordinates (lat/lon) are high-cardinality per point, so they are
# stored as FIELDS (never tags) and OMITTED when absent — enabling radius queries later.

input:
  redpanda:
    seed_brokers:
      - "redpanda:9092"
    topics:
      - "annotations.events"
    consumer_group: "influx-annotations-writer"
    auto_replay_nacks: true

pipeline:
  processors:
    - mapping: |
        # Expected JSON input (published to MQTT topic annotations/{location}):
        # {
        #   "ts": 1721563200,                              # optional, Unix seconds
        #   "location": "talhao-norte",                    # optional, context tag (place/zone)
        #   "kind": "audio",                               # optional, e.g. audio|photo|text
        #   "lat": -30.12345,                              # optional, GPS latitude  (field)
        #   "lon": -51.98765,                              # optional, GPS longitude (field)
        #   "gps_accuracy": 4.5,                           # optional, meters       (field)
        #   "object_key": "audio/2026-07-21/ann-001.opus", # optional, pointer into MinIO media/ bucket
        #   "summary": "pulgao na goiabeira"               # optional, short client-provided label
        # }
        #
        # Context model (Option 2): each context TYPE is its own low-cardinality tag
        # (starting with "location"; "asset"/"subsystem"/... can be added later with no
        # schema change since InfluxDB tags are schema-less). GPS coordinates are
        # high-cardinality per point, so they are FIELDS (never tags) and are OMITTED
        # entirely when absent (keeps radius queries clean).
        #
        # Output: InfluxDB line protocol, e.g.
        # annotations,location=talhao-norte,kind=audio lat=-30.12345,lon=-51.98765,gps_accuracy=4.5,object_key="audio/...opus",summary="pulgao" <ts_ns>

        let location = this.location.or("default")
        let kind = this.kind.or("unknown")
        let object_key = this.object_key.or("")
        let summary = this.summary.or("")

        # Tags cannot contain spaces/commas/equals unescaped → sanitize.
        let tags = "annotations,location=%s,kind=%s".format(
          $location.re_replace_all("[, =]", "_"),
          $kind.re_replace_all("[, =]", "_")
        )

        # GPS fields: include ONLY when present (Option A — omit when absent).
        let gps_fields = []
        let gps_fields = if this.lat != null { $gps_fields.append("lat=%v".format(this.lat)) } else { $gps_fields }
        let gps_fields = if this.lon != null { $gps_fields.append("lon=%v".format(this.lon)) } else { $gps_fields }
        let gps_fields = if this.gps_accuracy != null { $gps_fields.append("gps_accuracy=%v".format(this.gps_accuracy)) } else { $gps_fields }

        # String fields (always present, empty string is valid). Escape embedded quotes.
        let str_fields = [
          "object_key=\"%s\"".format($object_key.re_replace_all("\"", "\\\"")),
          "summary=\"%s\"".format($summary.re_replace_all("\"", "\\\""))
        ]

        let fields = $gps_fields.concat($str_fields).join(",")

        # Timestamp: assume seconds (Unix epoch), convert to nanoseconds. Fall back to now().
        let ts = this.ts.or(now().ts_unix())
        let ts_ns = ($ts * 1000000000).floor()

        root = "%s %s %v".format($tags, $fields, $ts_ns)

output:
  http_client:
    url: "http://influxdb:8181/api/v2/write?bucket=${INFLUXDB_DATABASE}&precision=ns"
    verb: POST
    headers:
      Content-Type: "text/plain; charset=utf-8"
    max_in_flight: 10
    batching:
      count: 50
      period: 2s
      processors:
        - archive:
            format: lines
